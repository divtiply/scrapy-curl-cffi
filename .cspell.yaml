version: "0.2"
dictionaryDefinitions:
  - name: custom-words
    path: ./custom-words.txt
    description: Custom dictionary
    addWords: true
  - name: ignore-words
    path: ./ignore-words.txt
    description: Words to ignore
    addWords: true
    noSuggest: true
dictionaries:
  - custom-words
  - ignore-words
ignorePaths:
  - ./custom-words.txt
  - ./ignore-words.txt
  - .git
  - .venv
  - ./uv.lock
