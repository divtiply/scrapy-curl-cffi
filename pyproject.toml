[project]
name = "scrapy-curl-cffi"
version = "0.4.0"
description = "Scrapy integration with curl_cffi (curl-impersonate)."
readme = "README.md"
authors = [
    { name = "Michel Ace", email = "divtiply@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "curl-cffi>=0.11.3",
    "scrapy>2.10",
    "typing-extensions>=4.16.0 ; python_full_version < '3.11'",
]

[project.urls]
source = "https://github.com/divtiply/scrapy-curl-cffi"

[project.optional-dependencies]
compression = [
    "brotli",
    "zstandard",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM",
    "CPY001",
    "D1",
    "D211",
    "D213",
    "FIX",
    "PGH003",
    "PLC0414",
    "TD001",
    "TD002",
    "TD003",
]

[tool.ruff.lint.per-file-ignores]
"examples/**.py" = [
    "ANN",
    "INP",
    "RUF012",
]
"tests/**.py" = [
    "ANN",
    "INP",
    "S101",
    "SLF001",
    "PLR2004",
]

[tool.commitizen]
tag_format = "v$version"
version_files = ["src/scrapy_curl_cffi/__init__.py"]
version_provider = "uv"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.26",
]
